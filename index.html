<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCICS - Submit a complaint</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="brand">SCICS</span><nav><a href="index.html">Submit complaint</a><a href="track.html">Track complaint</a><a href="admin.html">Admin</a></nav></header>
<main>
<h1>Smart Campus Infrastructure Complaint &amp; Tracking System</h1>
<div id="result"></div>
<form class="card" id="form">
  <h2>Submit a campus complaint</h2>
  <label>Your name <input name="name"></label>
  <label>Email <input name="email" type="email"></label>
  <label>Category <select name="category"></select></label>
  <label>Location (building / room) <input name="location"></label>
  <label>Describe the problem <textarea name="description" rows="3"></textarea></label>
  <button type="submit">Submit complaint</button>
</form>
</main>
<script src="store.js"></script>
<script>
const sel = document.querySelector('[name=category]');
sel.innerHTML = '<option value="">-- choose --</option>' + SCICS.getCategories().map(c => '<option>' + SCICS.esc(c) + '</option>').join('');
document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const out = document.getElementById('result');
  try {
    const c = SCICS.addComplaint(Object.fromEntries(new FormData(e.target)));
    out.innerHTML = '<div class="msg">Complaint submitted. Your reference ID: <span class="ref">' + c.id +
      '</span> <a href="track.html?id=' + c.id + '">View details</a></div>';
    e.target.reset();
  } catch (err) { out.innerHTML = '<div class="msg err">' + SCICS.esc(err.message) + '</div>'; }
});
</script></body></html>
